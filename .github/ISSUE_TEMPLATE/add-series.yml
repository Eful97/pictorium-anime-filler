name: Add series
description: Request one anime for the filler database.
title: "[Add series] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        One anime per issue. The title and episode count are enough; ids and
        ranges are optional.

  - type: input
    id: series_title
    attributes:
      label: Anime title
      placeholder: "e.g. Frieren: Beyond Journey's End"
    validations:
      required: true

  - type: input
    id: mal_id
    attributes:
      label: MAL id (optional)
      description: Leave empty if you do not know it.
      placeholder: "e.g. 52991"

  - type: input
    id: tmdb_id
    attributes:
      label: TMDB id (optional)
      description: The TV series id.
      placeholder: "e.g. 209867"

  - type: input
    id: total_episodes
    attributes:
      label: Episodes
      description: Regular seasons only (exclude specials).
      placeholder: "e.g. 28"
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source (optional)
      description: A link or short note about where the classification comes from.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: This is one anime, and I did not copy AFL or SkipTheFiller content.
          required: true
